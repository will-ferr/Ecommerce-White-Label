openapi: 3.1.0
info:
  title: Plataforma E-commerce White Label
  version: 0.1.0
  description: API REST compartilhada por todas as lojas da plataforma.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /
    description: Mesma origem do domínio da loja
security: []
tags:
  - name: System
    description: Estado da plataforma
  - name: Storefront
    description: Configuração pública das lojas
  - name: Identity
    description: >-
      Contas e sessões. As mesmas rotas existem em /api/v1/staff para equipes de loja e em
      /api/v1/platform para operadores, que também têm /team, /roles e /audit.
paths:
  /api/v1/status:
    get:
      operationId: getStatus
      tags: [System]
      summary: Consulta o estado público da plataforma
      responses:
        "200":
          description: Plataforma operando, com ou sem degradação
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemStatus"
        "503":
          description: Plataforma indisponível
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemStatus"
        default:
          description: Erro inesperado
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/storefront/config:
    get:
      operationId: getStorefrontConfig
      tags: [Storefront]
      summary: Consulta a configuração pública da loja do domínio acessado
      description: A loja é identificada somente pelo domínio da requisição.
      responses:
        "200":
          description: Configuração da loja
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorefrontConfig"
        "403":
          description: Loja suspensa (STORE_UNAVAILABLE)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Nenhuma loja configurada para o domínio (STORE_NOT_FOUND)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: Não foi possível identificar a loja no momento
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/auth/login:
    post:
      operationId: login
      tags: [Identity]
      summary: Inicia uma sessão
      responses:
        "200":
          description: Sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        default:
          description: Erro
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/auth/register:
    post:
      operationId: register
      tags: [Identity]
      summary: Cria uma conta de comprador
      responses:
        "2XX":
          description: Sucesso
        default:
          description: Erro
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/auth/mfa/challenge:
    post:
      operationId: completeChallenge
      tags: [Identity]
      summary: Conclui o login com o segundo fator
      responses:
        "200":
          description: Sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        default:
          description: Erro
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/auth/refresh:
    post:
      operationId: refreshSession
      tags: [Identity]
      summary: Renova a sessão usando o cookie
      responses:
        "200":
          description: Sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        default:
          description: Erro
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/auth/logout:
    post:
      operationId: logout
      tags: [Identity]
      summary: Encerra a sessão
      responses:
        "2XX":
          description: Sucesso
        default:
          description: Erro
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/auth/password/forgot:
    post:
      operationId: forgotPassword
      tags: [Identity]
      summary: Solicita a redefinição de senha
      responses:
        "2XX":
          description: Sucesso
        default:
          description: Erro
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/auth/password/reset:
    post:
      operationId: resetPassword
      tags: [Identity]
      summary: Define uma nova senha
      responses:
        "2XX":
          description: Sucesso
        default:
          description: Erro
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/auth/email/verify:
    post:
      operationId: verifyEmail
      tags: [Identity]
      summary: Confirma o e-mail
      responses:
        "2XX":
          description: Sucesso
        default:
          description: Erro
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/auth/me:
    get:
      operationId: getMe
      tags: [Identity]
      summary: Consulta a própria conta
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserView"
        default:
          description: Erro
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/auth/password/change:
    post:
      operationId: changePassword
      tags: [Identity]
      summary: Altera a senha
      security:
        - bearerAuth: []
      responses:
        "2XX":
          description: Sucesso
        default:
          description: Erro
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/auth/sessions:
    get:
      operationId: listSessions
      tags: [Identity]
      summary: Lista as sessões ativas
      security:
        - bearerAuth: []
      responses:
        "2XX":
          description: Sucesso
        default:
          description: Erro
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    delete:
      operationId: revokeOtherSessions
      tags: [Identity]
      summary: Encerra as outras sessões
      security:
        - bearerAuth: []
      responses:
        "2XX":
          description: Sucesso
        default:
          description: Erro
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/auth/access-history:
    get:
      operationId: accessHistory
      tags: [Identity]
      summary: Lista o histórico de acessos
      security:
        - bearerAuth: []
      responses:
        "2XX":
          description: Sucesso
        default:
          description: Erro
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/auth/mfa/enroll:
    post:
      operationId: enrollMfa
      tags: [Identity]
      summary: Inicia a verificação em duas etapas
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MfaEnrollment"
        default:
          description: Erro
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/auth/mfa/enroll/confirm:
    post:
      operationId: confirmMfa
      tags: [Identity]
      summary: Ativa a verificação em duas etapas
      security:
        - bearerAuth: []
      responses:
        "2XX":
          description: Sucesso
        default:
          description: Erro
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/auth/mfa/disable:
    post:
      operationId: disableMfa
      tags: [Identity]
      summary: Desativa a verificação em duas etapas
      security:
        - bearerAuth: []
      responses:
        "2XX":
          description: Sucesso
        default:
          description: Erro
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /health/live:
    get:
      operationId: getLiveness
      tags: [System]
      summary: Probe de liveness, acessível somente pela rede interna
      responses:
        "200":
          description: Processo ativo
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
  /health/ready:
    get:
      operationId: getReadiness
      tags: [System]
      summary: Probe de readiness, acessível somente pela rede interna
      responses:
        "200":
          description: Instância pronta para receber tráfego
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessReport"
        "503":
          description: Instância fora do balanceamento
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessReport"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    SystemState:
      type: string
      enum: [ok, degraded, unavailable]
    SystemStatus:
      type: object
      required: [status, version]
      properties:
        status:
          $ref: "#/components/schemas/SystemState"
        version:
          type: string
    ReadinessReport:
      type: object
      required: [status, checks]
      properties:
        status:
          $ref: "#/components/schemas/SystemState"
        checks:
          type: object
          additionalProperties:
            type: string
            enum: [up, down]
    StorefrontConfig:
      type: object
      required: [slug, store, seo, theme, features]
      properties:
        slug:
          type: string
        store:
          type: object
          required: [name, currency, locale, timezone]
          properties:
            name:
              type: string
            currency:
              type: string
            locale:
              type: string
            timezone:
              type: string
        seo:
          type: object
          required: [title, description, indexable]
          properties:
            title:
              type: string
            description:
              type: string
            indexable:
              type: boolean
        theme:
          type: object
          required: [version, tokens]
          properties:
            version:
              type: integer
            tokens:
              $ref: "#/components/schemas/ThemeTokens"
        features:
          type: object
          additionalProperties:
            type: boolean
    FontFamily:
      type: string
      enum: [system, humanist, geometric, serif, slab]
    ThemeTokens:
      type: object
      required: [colors, typography, shape, spacing, layout, assets]
      properties:
        colors:
          type: object
          required: [canvas, surface, ink, muted, line, primary, primaryStrong, onPrimary]
          properties:
            canvas:
              type: string
            surface:
              type: string
            ink:
              type: string
            muted:
              type: string
            line:
              type: string
            primary:
              type: string
            primaryStrong:
              type: string
            onPrimary:
              type: string
        typography:
          type: object
          required: [body, display]
          properties:
            body:
              $ref: "#/components/schemas/FontFamily"
            display:
              $ref: "#/components/schemas/FontFamily"
        shape:
          type: object
          required: [radius]
          properties:
            radius:
              type: string
              enum: [none, small, medium, large]
        spacing:
          type: object
          required: [density]
          properties:
            density:
              type: string
              enum: [compact, comfortable, spacious]
        layout:
          type: object
          required: [header]
          properties:
            header:
              type: string
              enum: [classic, centered]
        assets:
          type: object
          required: [logoUrl, faviconUrl]
          properties:
            logoUrl:
              type: string
            faviconUrl:
              type: string
    UserView:
      type: object
      required: [id, email, name, realm, emailVerified, mfaEnabled, permissions]
      properties:
        id:
          type: string
        email:
          type: string
        name:
          type: string
        realm:
          type: string
        emailVerified:
          type: boolean
        mfaEnabled:
          type: boolean
        role:
          type: string
        permissions:
          type: array
          items:
            type: string
    AuthResult:
      type: object
      required: [status]
      properties:
        status:
          type: string
        accessToken:
          type: string
        expiresIn:
          type: integer
        challenge:
          type: string
        user:
          $ref: "#/components/schemas/UserView"
        recoveryCodes:
          type: array
          items:
            type: string
    MfaEnrollment:
      type: object
      required: [secret, otpauthUri]
      properties:
        secret:
          type: string
        otpauthUri:
          type: string
    SessionView:
      type: object
      required: [id, device, ip, createdAt, lastUsedAt, current]
      properties:
        id:
          type: string
        device:
          type: string
        ip:
          type: string
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
        current:
          type: boolean
    AccessEvent:
      type: object
      required: [id, event, device, ip, occurredAt]
      properties:
        id:
          type: string
        event:
          type: string
        device:
          type: string
        ip:
          type: string
        occurredAt:
          type: string
          format: date-time
    TeamMember:
      type: object
      required: [id, email, name, status, mfaEnabled, role, roleName]
      properties:
        id:
          type: string
        email:
          type: string
        name:
          type: string
        status:
          type: string
        mfaEnabled:
          type: boolean
        role:
          type: string
        roleName:
          type: string
    RoleView:
      type: object
      required: [code, name]
      properties:
        code:
          type: string
        name:
          type: string
    AuditEntry:
      type: object
      required: [id, actorType, actorId, action, targetType, targetId, ip, metadata, occurredAt]
      properties:
        id:
          type: string
        actorType:
          type: string
        actorId:
          type: string
        action:
          type: string
        targetType:
          type: string
        targetId:
          type: string
        ip:
          type: string
        metadata:
          type: object
          additionalProperties:
            type: string
        occurredAt:
          type: string
          format: date-time
    FieldError:
      type: object
      required: [field, code, message]
      properties:
        field:
          type: string
        code:
          type: string
        message:
          type: string
    Problem:
      type: object
      description: Erro no formato RFC 9457
      required: [type, title, status, code]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
        correlation_id:
          type: string
        errors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
