# Local equivalent of the production Ingress: every host reaches the API on the
# same origin (ADR-005). Upstreams keep connections open (keepalive), so load does
# not exhaust ports, and "resolve" follows containers that are recreated.
# Access log without query strings or Referer: links carry one-time and order
# tokens (?token=...), which must never reach logs.
log_format safe '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent $request_time "$http_user_agent"';
resolver 127.0.0.11 valid=10s ipv6=off;
server_tokens off;
client_max_body_size 1m;

upstream api {
  zone api 64k;
  server api:8080 resolve;
  keepalive 64;
}

upstream platform {
  zone platform 64k;
  server platform:8080 resolve;
  keepalive 64;
}

upstream storefront {
  zone storefront 64k;
  server storefront:3000 resolve;
  keepalive 64;
}

upstream admin {
  zone admin 64k;
  server admin:8080 resolve;
  keepalive 64;
}

upstream console {
  zone console 64k;
  server console:8080 resolve;
  keepalive 64;
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      '';
}

proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
proxy_connect_timeout 5s;
proxy_read_timeout 35s;

# Painel da loja
server {
  listen 8080;
  access_log /dev/stdout safe;
  server_name ~^admin\.;

  location /api/ {
    proxy_pass http://api;
  }
  location / {
    proxy_pass http://admin;
  }
}

# Painel da plataforma. Sua API roda em um processo separado, o único com o
# papel de banco da plataforma (ADR-019).
server {
  listen 8080;
  access_log /dev/stdout safe;
  server_name ~^console\.;

  location /api/ {
    proxy_pass http://platform;
  }
  location / {
    proxy_pass http://console;
  }
}

# Lojas: qualquer outro host
server {
  listen 8080 default_server;
  access_log /dev/stdout safe;
  server_name _;

  location /api/ {
    proxy_pass http://api;
  }
  location /health/ {
    add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    return 404;
  }
  location / {
    proxy_pass http://storefront;
  }
}
