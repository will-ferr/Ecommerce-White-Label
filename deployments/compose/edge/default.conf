# Local equivalent of the production Ingress: every host reaches the API on the
# same origin (ADR-005). Variables make nginx resolve containers at request time.
resolver 127.0.0.11 valid=10s ipv6=off;
server_tokens off;
client_max_body_size 1m;

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      '';
}

proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
proxy_connect_timeout 5s;
proxy_read_timeout 35s;

# Painel da loja
server {
  listen 8080;
  server_name ~^admin\.;

  location /api/ {
    set $api http://api:8080;
    proxy_pass $api;
  }
  location / {
    set $admin http://admin:8080;
    proxy_pass $admin;
  }
}

# Painel da plataforma
server {
  listen 8080;
  server_name ~^console\.;

  location /api/ {
    set $api http://api:8080;
    proxy_pass $api;
  }
  location / {
    set $console http://console:8080;
    proxy_pass $console;
  }
}

# Lojas: qualquer outro host
server {
  listen 8080 default_server;
  server_name _;

  location /api/ {
    set $api http://api:8080;
    proxy_pass $api;
  }
  location /health/ {
    return 404;
  }
  location / {
    set $storefront http://storefront:3000;
    proxy_pass $storefront;
  }
}
