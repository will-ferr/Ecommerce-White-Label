# Access log without query strings or Referer: links carry one-time and order
# tokens (?token=...), which must never reach logs.
log_format safe '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent $request_time "$http_user_agent"';
server {
  listen 8080;
  access_log /dev/stdout safe;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  include /etc/nginx/snippets/security.conf;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok";
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    include /etc/nginx/snippets/security.conf;
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/snippets/security.conf;
    try_files $uri /index.html;
  }
}
