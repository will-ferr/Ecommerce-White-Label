version: "2"
overrides:
  go:
    overrides:
      - db_type: uuid
        go_type: github.com/google/uuid.UUID
      - db_type: uuid
        nullable: true
        go_type:
          import: github.com/google/uuid
          type: UUID
          pointer: true
      - db_type: timestamptz
        go_type: time.Time
      - db_type: timestamptz
        nullable: true
        go_type:
          type: time.Time
          pointer: true
      - db_type: text
        nullable: true
        go_type:
          type: string
          pointer: true
      - db_type: jsonb
        go_type: encoding/json.RawMessage
sql:
  - engine: postgresql
    schema: migrations
    queries: internal/modules/tenants/internal/adapters/postgres/queries
    gen:
      go:
        package: sqlcgen
        out: internal/modules/tenants/internal/adapters/postgres/sqlcgen
        sql_package: pgx/v5
  - engine: postgresql
    schema: migrations
    queries: internal/modules/identity/internal/sqlcgen/queries
    gen:
      go:
        package: sqlcgen
        out: internal/modules/identity/internal/sqlcgen
        sql_package: pgx/v5
  - engine: postgresql
    schema: migrations
    queries: internal/modules/audit/internal/sqlcgen/queries
    gen:
      go:
        package: sqlcgen
        out: internal/modules/audit/internal/sqlcgen
        sql_package: pgx/v5
