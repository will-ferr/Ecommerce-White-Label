version: "2"
sql:
  - engine: postgresql
    schema: migrations
    queries: internal/modules/tenants/internal/adapters/postgres/queries
    gen:
      go:
        package: sqlcgen
        out: internal/modules/tenants/internal/adapters/postgres/sqlcgen
        sql_package: pgx/v5
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              type: time.Time
              pointer: true
          - db_type: text
            nullable: true
            go_type:
              type: string
              pointer: true
          - db_type: jsonb
            go_type: encoding/json.RawMessage
